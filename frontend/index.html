<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical PDF RAG System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { 
            text-align: center; 
            color: white; 
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .upload-area:hover { border-color: #667eea; }
        .query-area textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            resize: vertical;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #5a6fd8; }
        .result { display: none; }
        .entity { 
            background: #e3f2fd; 
            padding: 8px 12px; 
            margin: 5px; 
            border-radius: 15px; 
            display: inline-block; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩺 Medical PDF RAG System</h1>
            <p>Upload medical PDFs and ask questions about medications, dosages, and conditions</p>
        </div>

        <div class="card">
            <h2>📁 Upload Medical PDF</h2>
            <div class="upload-area" onclick="document.getElementById('pdfUpload').click()">
                <p>Click to upload PDF or drop file here</p>
                <input type="file" id="pdfUpload" accept=".pdf" style="display: none;" onchange="handleFileUpload()">
            </div>
            <div id="uploadStatus"></div>
        </div>

        <div class="card">
            <h2>🔍 Ask Medical Questions</h2>
            <div class="query-area">
                <textarea id="questionInput" placeholder="Ask about medications, dosages, side effects, conditions..."></textarea>
                <button onclick="askQuestion()">Ask Question</button>
            </div>
        </div>

        <div class="card result" id="resultCard">
            <h2>📊 Results</h2>
            <div id="answer"></div>
            <div id="entities" style="margin-top: 20px;"></div>
        </div>

        <div class="card">
            <h2>📈 System Status</h2>
            <div id="systemStatus">Loading...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        // Handle file upload
        async function handleFileUpload() {
            const fileInput = document.getElementById('pdfUpload');
            const statusDiv = document.getElementById('uploadStatus');
            
            if (!fileInput.files[0]) return;
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            statusDiv.innerHTML = 'Uploading and processing PDF...';
            
            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    statusDiv.innerHTML = `✅ PDF processed! Found ${result.result.entities_found} medical entities.`;
                    fileInput.value = '';
                    updateSystemStatus();
                } else {
                    statusDiv.innerHTML = `❌ Error: ${result.detail}`;
                }
            } catch (error) {
                statusDiv.innerHTML = `❌ Upload failed: ${error.message}`;
            }
        }

        // Ask question
        async function askQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            const answerDiv = document.getElementById('answer');
            const entitiesDiv = document.getElementById('entities');
            const resultCard = document.getElementById('resultCard');
            
            if (!question) {
                alert('Please enter a question');
                return;
            }
            
            answerDiv.innerHTML = 'Searching for answers...';
            entitiesDiv.innerHTML = '';
            resultCard.style.display = 'block';
            
            const formData = new FormData();
            formData.append('question', question);
            
            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    // Display answer
                    answerDiv.innerHTML = `<h3>💡 Answer:</h3><p>${result.result.answer}</p>`;
                    
                    // Display entities
                    if (result.result.entities && result.result.entities.length > 0) {
                        let entitiesHTML = '<h3>🏷️ Medical Entities Found:</h3>';
                        result.result.entities.forEach(entity => {
                            entitiesHTML += `
                                <div class="entity">
                                    <strong>${entity.entity}</strong> (${entity.type})
                                    ${entity.neighbors.length ? `<br><small>Related: ${entity.neighbors.join(', ')}</small>` : ''}
                                </div>
                            `;
                        });
                        entitiesDiv.innerHTML = entitiesHTML;
                    }
                } else {
                    answerDiv.innerHTML = `❌ Error: ${result.detail}`;
                }
            } catch (error) {
                answerDiv.innerHTML = `❌ Query failed: ${error.message}`;
            }
        }

        // Update system status
        async function updateSystemStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const health = await response.json();
                
                const statsResponse = await fetch(`${API_BASE}/stats`);
                const stats = await statsResponse.json();
                
                document.getElementById('systemStatus').innerHTML = `
                    <p>✅ System: ${health.status}</p>
                    <p>📄 Documents: ${health.chunks_loaded} chunks</p>
                    <p>🏷️ Entities: ${stats.total_entities} medical terms</p>
                    <p>🔗 Relationships: ${stats.total_relationships} connections</p>
                `;
            } catch (error) {
                document.getElementById('systemStatus').innerHTML = '❌ Cannot connect to server';
            }
        }

        // Initialize
        updateSystemStatus();
        setInterval(updateSystemStatus, 10000); // Update every 10 seconds

        // Drag and drop support
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.querySelector('.upload-area');
            
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = '#667eea';
                this.style.background = '#f0f4ff';
            });
            
            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.style.borderColor = '#ccc';
                this.style.background = 'white';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                this.style.borderColor = '#ccc';
                this.style.background = 'white';
                
                const files = e.dataTransfer.files;
                if (files.length > 0 && files[0].type === 'application/pdf') {
                    document.getElementById('pdfUpload').files = files;
                    handleFileUpload();
                } else {
                    alert('Please drop a PDF file');
                }
            });
        });
    </script>
</body>
</html>
